<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[basis-io] - Page not found</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=PT+Serif:ital,wght@0,400;1,700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/basis-io-site/assets/css/styles.css">
<style>
  /* 404 fills the viewport below the header with one navy plate */
  .notfound { min-height: calc(100vh - 90px); display: flex; align-items: center; border-bottom: none; }
  .nf-code {
    font: 400 clamp(140px, 30vw, 340px)/0.85 "Silkscreen", "Courier New", monospace;
    color: var(--paper);
    letter-spacing: 0.04em;
    margin-left: -0.06em;
  }
  .notfound .hero { gap: 16px; }
  .notfound .btn-row { margin-top: 20px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__row">
    <a class="wordmark" href="/basis-io-site/" aria-label="[basis-io] home">[basis-<span class="wordmark__io">io</span>]</a>
  </div>
</header>

<main id="main">
  <section class="band band--navy band--grid notfound" aria-labelledby="nf-h">
    <div class="wrap hero">
      <p class="eyebrow">Error</p>
      <p class="nf-code" aria-hidden="true">404</p>
      <h1 id="nf-h">There is no basis <span style="white-space: nowrap;">for this page.</span></h1>
      <p class="lede">The address may have moved or never existed. The record of everything we do is one page long, and it is a click away.</p>
      <div class="btn-row">
        <a class="btn btn--primary" href="/basis-io-site/">Back to the site</a>
        <a class="btn btn--secondary" href="/basis-io-site/#enquiry">Send an enquiry</a>
      </div>
    </div>
  </section>
</main>

</body>
</html>
